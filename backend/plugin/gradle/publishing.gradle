pluginManager.withPlugin("maven-publish") {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId = pluginProperties.pluginGroupId
                artifactId = pluginProperties.pluginArtifactId
                version = pluginProperties.pluginVersion

                pom {
                    name = 'Documenten API WOPI Plugin'
                    description = 'The Documenten API WOPI plugin allows GZAC to communicate with the DRC (Document Registratie Component) using the Web application Open Platform Interface (WOPI). This enables users to view, edit and collaborate on documents stored in the DRC.'
                    developers {
                        developer {
                            id = "baseflow"
                            name = "Baseflow B.V."
                            email = "help@baseflow.com"
                        }
                    }
                }
            }
        }
    }
}
